version: "3.9"

# Local development stack: PostgreSQL + (optionally) API & prediction service.
# Frontend runs on Vercel/`next dev` separately.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thai2d
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/thai2d?schema=public
      PREDICTION_DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/thai2d
      NODE_ENV: development
      ALLOW_MOCK_DATA: "true"
      DATA_PROVIDER: thai2d
      PREDICTION_SERVICE_URL: http://prediction:8000
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me-now
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "4000:4000"

  prediction:
    build:
      context: ./services/prediction
      dockerfile: ../deployment/Dockerfile.prediction
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PREDICTION_DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/thai2d
      PREDICTION_API_TOKEN: change-me-internal-token
    ports:
      - "8000:8000"

volumes:
  pgdata:
